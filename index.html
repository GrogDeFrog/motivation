<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>New Tab</title>
    <meta name="description" content="">
    <meta name="viewport" content="width=device-width">
    <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="logo">
    <div class="coins">
        <div class="avers">
            <div>
                <div class="coin -one"></div>
                <div class="coin -two"></div>
                <div class="coin -three"></div>
            </div>
        </div>
    </div>
</div>
<div id="date-template" class="hide">
  <form id="date-form">
    <h1 class="age-label">When were you born?</h1>
    <footer>
      <label>
        <input type="date" id="date" name="date">
      </label>
      <button type="submit">Submit</button>
    </footer>
  </form>
</div>
<div id="time-template" class="hide">
  <form id="time-form">
    <h1 class="age-label">When were you born?</h1>
      <footer>
      <label>
        <input type="time" step="1" id="time" name="time">
      </label>
      <button type="submit">Submit</button>
    </footer>
  </form>
</div>

<div id="age-template" class="hide">
    <h1 class="age-label hide">AGE</h1>
    <h2 class="count"><span id="year"></span><sup>.<span id="milliseconds"></span></sup></h2>
</div>

<script src="app/app.js"></script>
</body>
</html>
